<style>
  /* ── Glassmorphism Panel ─────────────────────────────── */
  .glass-panel {
    background: rgba(25, 31, 49, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    border-left: 1px solid rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid rgba(76, 215, 246, 0.2);
    border-right: 1px solid rgba(76, 215, 246, 0.2);
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
    position: relative;
  }
  .glass-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
    opacity: 0.5;
    z-index: -1;
    border-radius: inherit;
    pointer-events: none;
  }

  /* ── Glow Hover Effect ───────────────────────────────── */
  .glow-hover:hover {
    box-shadow: 0 0 15px rgba(76, 215, 246, 0.4), 0 0 30px rgba(77, 142, 255, 0.15);
    border-color: rgba(76, 215, 246, 0.6);
  }

  /* ── Noise Overlay (body-level) ──────────────────────── */

    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* ── Syntax Highlighting Classes ─────────────────────── */
  .kw  { color: #ff79c6; }
  .fn  { color: #50fa7b; }
  .str { color: #f1fa8c; }
  .cm  { color: #3d3f4e; font-style: italic; }
  .num { color: #bd93f9; }
  .op  { color: #ff4747; }

  /* ── Hero Title Responsive ───────────────────────────── */

    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(56px, 10vw, 120px);
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.04em;
  }

  /* ── Watermark ───────────────────────────────────────── */
  .watermark {
    position: absolute;
    right: -20px;
    top: -30px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 280px;
    font-weight: 800;
    color: #adc6ff;
    opacity: 0.03;
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }

  /* ── Meta Item Styling ───────────────────────────────── */
  .meta-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 600;
  }
